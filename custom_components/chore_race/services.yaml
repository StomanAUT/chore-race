create_participant:
  name: Create participant
  description: Create a participant with a stable ID.
  fields:
    name:
      required: true
      selector:
        text:
    person_entity_id:
      selector:
        entity:
          domain: person
    avatar:
      selector:
        text:
    sort_order:
      default: 0
      selector:
        number:
          mode: box
    role:
      default: child
      selector:
        select:
          options:
            - child
            - adult
    can_do_restricted_tasks:
      default: false
      selector:
        boolean:

create_recurrence_rule:
  name: Create recurrence rule
  description: Schedule a chore every N days, monthly, or yearly.
  fields:
    chore_type_id:
      required: true
      selector:
        text:
    start_date:
      required: true
      selector:
        date:
    frequency:
      required: true
      selector:
        select:
          options:
            - days
            - monthly
            - yearly
    interval:
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
    area_id:
      selector:
        area:
    floor_id:
      description: Alternative to area_id for a task covering an entire floor.
      selector:
        floor:
    preferred_participant_id:
      selector:
        text:

update_recurrence_rule:
  name: Update recurrence rule
  description: Update or deactivate a recurrence rule; existing tasks remain unchanged.
  fields:
    rule_id:
      required: true
      selector:
        text:
    chore_type_id:
      selector:
        text:
    start_date:
      selector:
        date:
    frequency:
      selector:
        select:
          options:
            - days
            - monthly
            - yearly
    interval:
      selector:
        number:
          min: 1
          max: 365
          mode: box
    area_id:
      selector:
        area:
    floor_id:
      description: Alternative to area_id for a task covering an entire floor.
      selector:
        floor:
    preferred_participant_id:
      selector:
        text:
    active:
      selector:
        boolean:

delete_recurrence_rule:
  name: Delete recurrence rule
  description: Delete a recurrence rule while preserving tasks it already created.
  fields:
    rule_id:
      required: true
      selector:
        text:

start_race:
  name: Start race
  description: Start a race using the configured duration.

stop_race:
  name: Stop race
  description: Finish the currently running race.

update_participant:
  name: Update participant
  description: Update participant fields without changing the stable ID.
  fields:
    participant_id:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    active:
      selector:
        boolean:
    person_entity_id:
      selector:
        entity:
          domain: person
    avatar:
      selector:
        text:
    sort_order:
      selector:
        number:
          mode: box
    role:
      selector:
        select:
          options:
            - child
            - adult
    can_do_restricted_tasks:
      selector:
        boolean:

create_chore_type:
  name: Create chore type
  description: Create a reusable chore definition.
  fields:
    name:
      required: true
      selector:
        text:
    default_race_points:
      required: true
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    icon:
      selector:
        icon:
    image:
      selector:
        text:
    streak_enabled:
      default: false
      selector:
        boolean:
    streak_max_bonus:
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    default_copilot_points:
      default: 1
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    difficulty:
      selector:
        select:
          options:
            - easy
            - medium
            - hard
    adult_only:
      default: false
      selector:
        boolean:
    confirmation_required:
      default: false
      selector:
        boolean:

update_chore_type:
  name: Update chore type
  description: Update future defaults; existing task point snapshots remain unchanged.
  fields:
    chore_type_id:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    default_race_points:
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    icon:
      selector:
        icon:
    image:
      selector:
        text:
    difficulty:
      selector:
        select:
          options:
            - easy
            - medium
            - hard
    adult_only:
      selector:
        boolean:
    confirmation_required:
      selector:
        boolean:
    active:
      selector:
        boolean:

delete_chore_type:
  name: Delete chore type
  description: Permanently delete a chore type that has no task or recurrence references.
  fields:
    chore_type_id:
      required: true
      selector:
        text:

create_task:
  name: Create task
  description: Create a concrete dated task.
  fields:
    chore_type_id:
      required: true
      selector:
        text:
    date:
      required: true
      selector:
        date:
    area_id:
      selector:
        area:
    floor_id:
      description: Alternative to area_id for a task covering an entire floor.
      selector:
        floor:
    race_points:
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    preferred_participant_id:
      selector:
        text:
    source:
      default: manual
      selector:
        select:
          options:
            - manual
            - recurring
            - entity
            - automation
            - chain
    source_entity_id:
      selector:
        entity:

update_task:
  name: Update task
  description: Update an untouched open task outside a running race.
  fields:
    task_id:
      required: true
      selector:
        text:
    chore_type_id:
      selector:
        text:
    date:
      selector:
        date:
    area_id:
      selector:
        area:
    floor_id:
      description: Alternative to area_id for a task covering an entire floor.
      selector:
        floor:
    race_points:
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    preferred_participant_id:
      selector:
        text:
    blocked:
      selector:
        boolean:

complete_task:
  name: Complete task
  description: Complete an open task and optionally apply race-only teamwork bonuses.
  fields:
    task_id:
      required: true
      selector:
        text:
    participant_id:
      required: true
      selector:
        text:
    copilot_participant_id:
      selector:
        text:
    fair_play:
      default: false
      selector:
        boolean:

undo_completion:
  name: Undo completion
  description: Revert a completion and reopen its task.
  fields:
    completion_id:
      required: true
      selector:
        text:

delete_task:
  name: Delete task
  description: Delete a task that has no completion history.
  fields:
    task_id:
      required: true
      selector:
        text:
