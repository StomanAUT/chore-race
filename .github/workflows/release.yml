name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/chore_race/manifest.json").read_text()
          )
          expected = f"v{manifest['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match manifest {expected!r}"
              )
          PY

      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pytest-homeassistant-custom-component ruff

      - name: Lint and test
        run: |
          python -m ruff check .
          python -m pytest

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"

      - name: Build HACS release archive
        run: |
          cd custom_components/chore_race
          zip -r ../../chore_race.zip . \
            -x "__pycache__/*" "*.pyc" "*.pyo"
          cd ../..
          unzip -t chore_race.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" chore_race.zip
          --title "Chore Race ${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag
